  storage:
    container_name: supabase-storage
    image: supabase/storage-api:v0.43.11
    depends_on:
      # db:
      #   # Disable this if you are using an external Postgres database
      #   condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
      # minio:
      #   condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5000/status"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    restart: unless-stopped
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: s3
      GLOBAL_S3_BUCKET: ${AWS_BUCKET}  # Set your S3 bucket name
      GLOBAL_S3_ENDPOINT: https://s3.amazonaws.com
      GLOBAL_S3_PROTOCOL: https
      GLOBAL_S3_FORCE_PATH_STYLE: false  # Set to false for external S3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}  # Set your AWS access key
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}  # Set your AWS secret key
      AWS_DEFAULT_REGION: ${AWS_REGION}  # Set your S3 region
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: ${AWS_REGION}  # Set your S3 region
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
    volumes:
      - ./volumes/storage:/var/lib/storage:z

  imgproxy:
    container_name: supabase-imgproxy
    image: darthsim/imgproxy:v3.8.0
    healthcheck:
      test: [ "CMD", "imgproxy", "health" ]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: ${IMGPROXY_ENABLE_WEBP_DETECTION}
